<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0f0f13;
            color: #ffffff;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .control-panel {
            background: #18181f;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }
        h2 { 
            text-align: center; 
            font-size: 18px; 
            margin-top: 0; 
            margin-bottom: 20px; 
            color: #00ffcc; 
            letter-spacing: -0.5px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label { 
            font-size: 13px; 
            color: #9ba1a6; 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #22222b;
            border: 1px solid #333342;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00ffcc;
        }
        .save-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .save-btn:hover { opacity: 0.9; }
        .status-msg {
            text-align: center;
            font-size: 12px;
            color: #00ffcc;
            margin-top: 12px;
            height: 16px;
        }
    </style>
</head>
<body>

<div class="control-panel">
    <h2>방송 리모컨 제어판 (DB 연동)</h2>
    
    <div class="input-group">
        <label>위젯 타이틀 (제목)</label>
        <input type="text" id="titleInput" placeholder="예: 오늘 목표 후원금">
    </div>

    <div class="input-group">
        <label>현재 후원금 (원)</label>
        <input type="number" id="currentInput" placeholder="예: 50000">
    </div>

    <div class="input-group">
        <label>목표 후원금 (원)</label>
        <input type="number" id="goalInput" placeholder="예: 100000">
    </div>

    <button class="save-btn" onclick="saveDataToDB()">데이터베이스에 적용하기</button>
    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    async function saveDataToDB() {
        const title = document.getElementById('titleInput').value;
        const current = document.getElementById('currentInput').value;
        const goal = document.getElementById('goalInput').value;
        const msg = document.getElementById('statusMsg');

        try {
            // 로컬 또는 서버 API로 데이터 전송
            const response = await fetch('http://localhost:3000/api/widget-setting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, current, goal })
            });

            if (response.ok) {
                msg.innerText = 'DB에 성공적으로 반영되었습니다!';
            } else {
                msg.innerText = '저장 실패 (서버를 확인하세요)';
            }
        } catch (error) {
            msg.innerText = '서버 연결 실패 (로컬 서버 구동 필요)';
        }

        setTimeout(() => { msg.innerText = ''; }, 2500);
    }
</script>

</body>
</html>
