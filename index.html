<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Stream Widget - Viewer Screen</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: transparent;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            color: #ffffff;
        }
        .widget-wrapper {
            width: 420px;
            padding: 20px;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .title { font-size: 15px; font-weight: 600; color: #b3b3b3; }
        .percentage { font-size: 18px; font-weight: bold; color: #00ffcc; }
        .amount-area {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }
        .amount-area span { font-size: 16px; color: #888; font-weight: normal; }
        .bar-container {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .bar-gauge {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 8px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

<div class="widget-wrapper">
    <div class="header-area">
        <div class="title" id="displayTitle">후원 목표 달성 현황</div>
        <div class="percentage" id="displayPercent">0%</div>
    </div>
    <div class="amount-area" id="displayAmount">
        0원 <span>/ 100,000원</span>
    </div>
    <div class="bar-container">
        <div class="bar-gauge" id="displayGauge"></div>
    </div>
</div>

<script>
    async function fetchWidgetData() {
        try {
            const response = await fetch('http://localhost:3000/api/widget-setting');
            if (!response.ok) return;
            const data = await response.json();

            const current = Number(data.current_amount) || 0;
            const goal = Number(data.goal_amount) || 100000;
            const title = data.title_text || '후원 목표 달성 현황';

            let percent = goal > 0 ? Math.round((current / goal) * 100) : 0;
            if (percent > 100) percent = 100;

            document.getElementById('displayTitle').innerText = title;
            document.getElementById('displayPercent').innerText = percent + '%';
            document.getElementById('displayAmount').innerHTML = 
                current.toLocaleString() + '원 <span>/ ' + goal.toLocaleString() + '원</span>';
            document.getElementById('displayGauge').style.width = percent + '%';
        } catch (e) {
            console.log('DB 연동 대기 중...');
        }
    }

    // 최초 로드 및 1초마다 DB 데이터를 실시간으로 감지(폴링)
    fetchWidgetData();
    setInterval(fetchWidgetData, 1000);
</script>

</body>
</html>
